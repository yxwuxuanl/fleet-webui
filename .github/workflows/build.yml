name: Development build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.repository == 'yxwuxuanl/fleet-webui'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0
      - name: Resolve build identity
        id: meta
        run: python3 scripts/pipeline.py prepare --mode development
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Check for an existing image
        id: existing
        run: python3 scripts/pipeline.py image-check
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.existing.outputs.reuse != 'true'
      - name: Build image locally for testing
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.image_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max
      - name: Test container and package chart
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          bash scripts/smoke-container.sh "$IMAGE"
          python3 scripts/pipeline.py package
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: fleet-release
          wait: 120s
      - name: Install chart in a disposable Kubernetes cluster
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          CHART: ${{ steps.meta.outputs.chart }}
        run: bash scripts/smoke-chart.sh "$IMAGE" "$CHART"
      - name: Publish the tested image
        if: steps.existing.outputs.reuse != 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push "$IMAGE"
      - name: Verify anonymous downloads
        run: python3 scripts/pipeline.py verify-public
      - name: Record artifact checksums and image digest
        run: python3 scripts/pipeline.py checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-${{ steps.meta.outputs.version }}-${{ github.run_attempt }}
          path: |
            release-output/*.tgz
            release-output/build-info.json
            release-output/SHA256SUMS
            release-output/LICENSE
            release-output/CHANGELOG.md
          if-no-files-found: error
          retention-days: 14
      - name: Summarize development build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          printf 'Image: `%s`\n\nChart artifact version: `%s`\n' "$IMAGE" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
