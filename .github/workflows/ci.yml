name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Scan full history with redacted output
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --log-opts=--all .
  checks:
    name: Build, test and Helm checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.3.0
      - name: Check formatting
        run: test -z "$(gofmt -l ./*.go)"
      - name: Test publishing guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build frontend, test Go and vet
        run: make test
      - name: Validate chart and configuration combinations
        run: make chart-test
      - name: Build standalone binary
        run: go build -trimpath -o fleet-webui .
      - name: Package chart for inspection
        run: |
          mkdir -p release-output
          helm package charts/fleet-webui --destination release-output
          helm lint release-output/fleet-webui-*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-output/*.tgz
          if-no-files-found: error
          retention-days: 7

  container:
    name: Container smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fleet-webui:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max
      - name: Start image without cluster credentials
        run: |
          bash scripts/smoke-container.sh fleet-webui:ci
