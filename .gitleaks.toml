title = "Fleet WebUI secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Historical Helm NOTES example; retained for full-history secret scanning"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)charts/fleet-webui/templates/NOTES\.txt$''']
regexTarget = "match"
regexes = ['''token and set:\s+ntfy\.enabled=true''']
