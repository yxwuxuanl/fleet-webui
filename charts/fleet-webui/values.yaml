replicaCount: 1

image:
  repository: registry.cn-shenzhen.aliyuncs.com/lin2ur/fleet-webui
  pullPolicy: IfNotPresent
  tag: "57086c5c"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fleet-webui.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

fleet:
  requestTimeoutSeconds: 12

ntfy:
  enabled: false
  baseURL: ""
  topic: ""
  existingSecret: ""
  tokenKey: token

appBaseURL: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
