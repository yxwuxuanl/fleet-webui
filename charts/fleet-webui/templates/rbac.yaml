{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fleet-webui.fullname" . }}
  labels:
    {{- include "fleet-webui.labels" . | nindent 4 }}
rules:
  - apiGroups: ["fleet.cattle.io"]
    resources: ["bundles", "gitrepos", "clusters", "bundledeployments"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.managedObjects.enabled }}
  # Live YAML is restricted by the API to objects indexed by a BundleDeployment.
  # Kubernetes RBAC cannot express arbitrary dynamic kinds more narrowly than get-only.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.reconcile.enabled }}
  - apiGroups: ["fleet.cattle.io"]
    resources: ["bundles"]
    verbs: ["patch"]
  {{- end }}
  {{- if .Values.gitHistory.enabled }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.gitRepoActions.enabled }}
  - apiGroups: ["fleet.cattle.io"]
    resources: ["gitrepos"]
    verbs: ["patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fleet-webui.fullname" . }}
  labels:
    {{- include "fleet-webui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fleet-webui.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fleet-webui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
